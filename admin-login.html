<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOTIA STORE - Admin Login</title>
    <style>
        :root {
            --primary: #8B4513;
            --accent: #D2691E;
            --dark: #1e293b;
            --gray-bg: #f5efe1;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 69, 19, 0.3);
        }

        .error-message {
            display: none;
            background: #fee2e2;
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border-left: 4px solid var(--danger);
        }

        .error-message.show {
            display: block;
        }

        .back-link {
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>⚙️ JOTIA STORE</h1>
            <p>لوحة التحكم</p>
        </div>

        <div class="error-message" id="errorMsg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>🔐 كلمة المرور:</label>
                <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn-login">دخول 🔓</button>
        </form>

        <div class="back-link">
            <a href="index.html">← العودة للمتجر</a>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "PATCHA @#2004";
        const SESSION_KEY = 'jotia_admin_session';

        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (password === ADMIN_PASSWORD) {
                localStorage.setItem(SESSION_KEY, 'true');
                window.location.href = 'admin-panel.html';
            } else {
                errorMsg.textContent = '❌ كلمة المرور خاطئة!';
                errorMsg.classList.add('show');
                document.getElementById('passwordInput').value = '';
            }
        }

        // إذا كان مسجل دخول، روح مباشرة للـ Admin
        window.addEventListener('load', () => {
            if (localStorage.getItem(SESSION_KEY) === 'true') {
                window.location.href = 'admin-panel.html';
            }
        });
    </script>
</body>
</html>
