<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOTIA STORE - سوق الملابس القديمة</title>
    <style>
        :root {
            --primary: #8B4513;
            --primary-dark: #704214;
            --accent: #D2691E;
            --dark: #1e293b;
            --gray-bg: #f5efe1;
            --card-border: #d4c5b9;
            --dark-bg: #0f172a;
            --dark-card: #1e293b;
            --dark-text: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--gray-bg); 
            color: var(--dark); 
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-color: var(--dark-bg);
            color: var(--dark-text);
        }

        /* Top Bar */
        .top-bar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            padding: 16px 20px;
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.25);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        body.dark-mode .top-bar {
            background: linear-gradient(135deg, #2d1810 0%, #5a3a1a 100%);
        }

        .top-bar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle, .theme-toggle, .admin-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-btn {
            font-size: 1rem;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            font-weight: 600;
        }

        .admin-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .menu-toggle:hover, .theme-toggle:hover {
            transform: scale(1.1);
        }

        .top-bar h2 {
            color: white;
            font-size: 1.3rem;
            flex: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .language-switcher {
            display: flex;
            gap: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 20px;
        }

        .lang-btn {
            background-color: transparent;
            color: white;
            border: 2px solid transparent;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background-color: white;
            color: var(--primary);
        }

        .lang-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Sidebar */
        .side-nav {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 20px rgba(0,0,0,0.1);
            padding: 20px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 998;
            overflow-y: auto;
        }

        body.dark-mode .side-nav {
            background: var(--dark-card);
            color: var(--dark-text);
        }

        .side-nav.active {
            transform: translateX(0);
        }

        .side-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--card-border);
        }

        body.dark-mode .side-nav-header {
            border-bottom-color: #475569;
        }

        .side-nav-header h3 {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .close-nav {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--dark);
        }

        body.dark-mode .close-nav {
            color: var(--dark-text);
        }

        .nav-link {
            display: block;
            padding: 14px 16px;
            background-color: var(--gray-bg);
            border-radius: 10px;
            text-decoration: none;
            color: var(--dark);
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            text-align: right;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        body.dark-mode .nav-link {
            background-color: #334155;
            color: var(--dark-text);
        }

        .nav-link:hover {
            background-color: var(--primary);
            color: white;
            transform: translateX(-8px);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 997;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.95) 0%, rgba(210, 105, 30, 0.95) 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            color: white;
        }

        body.dark-mode header {
            background: linear-gradient(135deg, #2d1810 0%, #5a3a1a 100%);
        }

        header h1 { 
            font-size: 2.2rem; 
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p { 
            color: rgba(255,255,255,0.95); 
            font-size: 1rem;
            font-weight: 500;
        }

        /* Search Bar */
        .search-container {
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 0 16px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid var(--card-border);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background-color: white;
        }

        body.dark-mode .search-input {
            background-color: var(--dark-card);
            border-color: #475569;
            color: var(--dark-text);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .search-btn {
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-btn:hover {
            background-color: var(--accent);
        }

        .filter-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .filter-tag {
            padding: 8px 16px;
            background-color: var(--gray-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        body.dark-mode .filter-tag {
            background-color: #334155;
            border-color: #475569;
            color: var(--dark-text);
        }

        .filter-tag:hover, .filter-tag.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Container & Products Grid */
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 16px; 
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Product Card */
        .product-card {
            background: #ffffff;
            border: 2px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        body.dark-mode .product-card {
            background: var(--dark-card);
            border-color: #475569;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(139, 69, 19, 0.15);
            border-color: var(--accent);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: var(--gray-bg);
        }

        .product-info { 
            padding: 14px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .product-title { 
            font-size: 1rem; 
            font-weight: bold; 
            margin-bottom: 4px;
            color: var(--dark);
        }

        body.dark-mode .product-title {
            color: var(--dark-text);
        }

        .product-desc { 
            font-size: 0.8rem; 
            color: #64748b; 
            margin-bottom: 8px; 
            flex-grow: 1;
            line-height: 1.3;
        }

        body.dark-mode .product-desc {
            color: #94a3b8;
        }

        .product-bottom { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-top: 8px;
        }

        .product-price { 
            font-size: 1.1rem; 
            font-weight: bold; 
            color: var(--accent);
        }

        .btn-order {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-order:hover { 
            background-color: var(--accent);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            position: relative;
            animation: fadeIn 0.25s ease-out;
        }

        body.dark-mode .modal-content {
            background: var(--dark-card);
            color: var(--dark-text);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #94a3b8;
            cursor: pointer;
        }

        .modal-header { 
            margin-bottom: 16px; 
            border-bottom: 2px solid var(--accent); 
            padding-bottom: 12px; 
        }

        .modal-title { 
            font-size: 1.1rem; 
            color: var(--primary);
            font-weight: bold;
        }

        .modal-price { 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 1.1rem; 
            margin-top: 4px; 
        }

        /* Form */
        .form-group { margin-bottom: 14px; }

        .form-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: var(--primary); 
            margin-bottom: 6px; 
        }

        body.dark-mode .form-group label {
            color: var(--dark-text);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--card-border);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            background-color: #fff;
            color: var(--dark);
        }

        body.dark-mode .form-group input, body.dark-mode .form-group textarea {
            background-color: #334155;
            border-color: #475569;
            color: var(--dark-text);
        }

        .form-group input:focus, .form-group textarea:focus { 
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover { 
            background-color: var(--accent);
        }

        .badge {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-content">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h2 id="storeName">JOTIA STORE</h2>
            <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>
            <a href="admin.html" class="admin-btn">⚙️ Admin</a>
            <div class="language-switcher">
                <button class="lang-btn active" onclick="setLanguage('ar')">العربية</button>
                <button class="lang-btn" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" onclick="setLanguage('fr')">FR</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <nav class="side-nav" id="sideNav">
        <div class="side-nav-header">
            <h3 id="navTitle">القائمة</h3>
            <button class="close-nav" onclick="toggleSidebar()">✕</button>
        </div>
        <div>
            <a class="nav-link" onclick="scrollToSection('products'); toggleSidebar()">
                <span id="navProducts">👕 الملابس</span>
            </a>
            <a class="nav-link" onclick="window.location.href='todo.html'">
                <span id="navTodos">📝 قائمة المهام</span>
            </a>
            <a class="nav-link" onclick="scrollToSection('contact'); toggleSidebar()">
                <span id="navContact">📞 اتصل بنا</span>
            </a>
        </div>
    </nav>

    <!-- Header -->
    <header>
        <h1 id="headerTitle">JOTIA STORE</h1>
        <p id="headerDesc">🏪 سوق الملابس والبرا القديمة - أسعار منخفضة جداً</p>
    </header>

    <!-- Search & Filter -->
    <div class="search-container">
        <div class="search-box">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="ابحث عن منتوج..." 
                onkeyup="filterProducts()"
            >
            <button class="search-btn" onclick="filterProducts()">🔍 بحث</button>
        </div>
        <div class="filter-tags" id="filterTags"></div>
    </div>

    <!-- Products -->
    <div class="container">
        <div class="products-grid" id="products"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeOrderModal()">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title" id="modalProductTitle">اسم المنتوج</h3>
                <div class="modal-price" id="modalProductPrice">0 درهم</div>
            </div>
            
            <form id="modalForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label id="labelName">الاسم الكامل:</label>
                    <input type="text" id="custName" required>
                </div>
                <div class="form-group">
                    <label id="labelPhone">رقم الهاتف:</label>
                    <input type="tel" id="custPhone" required>
                </div>
                <div class="form-group">
                    <label id="labelAddress">المدينة:</label>
                    <input type="text" id="custAddress" required>
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit">أرسل عبر واتساب</button>
            </form>
        </div>
    </div>

    <script>
        const myPhoneNumber = "212621344556";
        const STORAGE_KEY = 'jotia_products'; // نفس المفتاح في Admin
        let currentLanguage = 'ar';
        let selectedProduct = "";
        let selectedPrice = "";

        const translations = {
            ar: {
                storeName: "JOTIA STORE",
                headerDesc: "🏪 سوق الملابس والبرا القديمة - أسعار منخفضة جداً",
                navTitle: "القائمة",
                navProducts: "👕 الملابس",
                navTodos: "📝 قائمة المهام",
                navContact: "📞 اتصل بنا",
                labelName: "الاسم الكامل:",
                labelPhone: "رقم الهاتف:",
                labelAddress: "المدينة:",
                btnSubmit: "أرسل عبر واتساب",
                noProducts: "لا توجد منتجات حالياً"
            },
            en: {
                storeName: "JOTIA STORE",
                headerDesc: "🏪 Old Clothes & Vintage Market - Very Low Prices",
                navTitle: "Menu",
                navProducts: "👕 Clothes",
                navTodos: "📝 To-Do List",
                navContact: "📞 Contact Us",
                labelName: "Full Name:",
                labelPhone: "Phone Number:",
                labelAddress: "City:",
                btnSubmit: "Send via WhatsApp",
                noProducts: "No products available"
            },
            fr: {
                storeName: "JOTIA STORE",
                headerDesc: "🏪 Marché de vêtements vintage - Prix très bas",
                navTitle: "Menu",
                navProducts: "👕 Vêtements",
                navTodos: "📝 Liste des tâches",
                navContact: "📞 Nous contacter",
                labelName: "Nom complet:",
                labelPhone: "Numéro de téléphone:",
                labelAddress: "Ville:",
                btnSubmit: "Envoyer via WhatsApp",
                noProducts: "Aucun produit disponible"
            }
        };

        function getProducts() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            document.getElementById('storeName').textContent = translations[lang].storeName;
            document.getElementById('headerTitle').textContent = translations[lang].storeName;
            document.getElementById('headerDesc').textContent = translations[lang].headerDesc;
            document.getElementById('navTitle').textContent = translations[lang].navTitle;
            document.getElementById('navProducts').textContent = translations[lang].navProducts;
            document.getElementById('navTodos').textContent = translations[lang].navTodos;
            document.getElementById('navContact').textContent = translations[lang].navContact;
            document.getElementById('labelName').textContent = translations[lang].labelName;
            document.getElementById('labelPhone').textContent = translations[lang].labelPhone;
            document.getElementById('labelAddress').textContent = translations[lang].labelAddress;
            document.getElementById('btnSubmit').textContent = translations[lang].btnSubmit;

            displayProducts();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        function toggleSidebar() {
            document.getElementById('sideNav').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function displayProducts(productsToShow = null) {
            const allProducts = getProducts();
            const productsToDisplay = productsToShow || allProducts;
            
            const categories = [...new Set(allProducts.map(p => p.category))];
            const filterTags = document.getElementById('filterTags');
            
            if (filterTags.children.length === 0 && categories.length > 0) {
                filterTags.innerHTML = categories.map(cat => 
                    `<div class="filter-tag" onclick="filterByCategory('${cat}')">${cat}</div>`
                ).join('');
            }

            const productsContainer = document.getElementById('products');

            if (productsToDisplay.length === 0) {
                productsContainer.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">${translations[currentLanguage].noProducts}</div>`;
                return;
            }

            const productsHtml = productsToDisplay.map(p => {
                return `
                    <div class="product-card">
                        <span class="badge">برا قديم</span>
                        <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200x180?text=${p.name}'">
                        <div class="product-info">
                            <div class="product-category">${p.category}</div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-desc">${p.desc}</div>
                            <div class="product-bottom">
                                <div class="product-price">${p.price}د</div>
                                <button class="btn-order" onclick="openOrderModal('${p.name}', '${p.price}د')">اطلب</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            productsContainer.innerHTML = productsHtml;
        }

        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const allProducts = getProducts();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(search) || 
                p.desc.toLowerCase().includes(search)
            );
            displayProducts(filtered);
        }

        function filterByCategory(category) {
            const allProducts = getProducts();
            const filtered = allProducts.filter(p => p.category === category);
            displayProducts(filtered);
        }

        function openOrderModal(name, price) {
            selectedProduct = name;
            selectedPrice = price;
            document.getElementById('modalProductTitle').innerText = name;
            document.getElementById('modalProductPrice').innerText = price;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if (!name || !phone || !address) return;

            const message = `السلام عليكم، بغيت نطلب هاد المنتوج:%0A%0A*المنتوج:* ${selectedProduct}%0A*السعر:* ${selectedPrice}%0A%0A*الاسم:* ${name}%0A*الهاتف:* ${phone}%0A*المدينة:* ${address}`;

            window.open(`https://wa.me/${myPhoneNumber}?text=${message}`, '_blank');
            closeOrderModal();
        }

        window.onclick = function(event) {
            const modal = document.getElementById('orderModal');
            if (event.target === modal) {
                closeOrderModal();
            }
        }

        // تحميل الوضع المظلم المحفوظ
        window.addEventListener('load', () => {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }
            displayProducts();
        });
    </script>
</body>
</html>
